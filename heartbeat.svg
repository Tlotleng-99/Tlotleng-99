<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60" role="img" aria-label="Heartbeat line">
  <title>Heartbeat</title>
  <defs>
    <filter id="glow2" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .ecg-base { fill: none; stroke: #23446E; stroke-width: 1.6; stroke-linejoin: round; }
      .ecg-live { fill: none; stroke: #6C9FD0; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 110 890; animation: beat 3.2s linear infinite; }
      @keyframes beat { from { stroke-dashoffset: 110; } to { stroke-dashoffset: -890; } }
      .pulse { animation: lub 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes lub { 0%, 100% { opacity: 1; } 12% { opacity: 0.55; } 24% { opacity: 1; } 36% { opacity: 0.7; } 48% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .ecg-live, .pulse, .blink { animation: none; } }
    </style>
  </defs>
